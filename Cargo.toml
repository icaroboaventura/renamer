[package]
name = "renamer"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Offline batch file renamer for macOS with previews, undo, and a JSON CLI"
license = "MIT"
repository = "https://github.com/icaroboaventura/renamer"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
eframe = { package = "eframe", version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
fancy-regex = "=0.16.2"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
unicode_categories = "0.1"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
fs2 = "0.4"
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
